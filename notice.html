<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 2학년 2반 | 공지사항</title>
  <meta name="description" content="2026학년도 2학년 2반 학급 공지사항 전용 페이지">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
</head>

<body data-page="notice">

  <!-- =========================================================================
       Site Header (Hallmark N5 Floating Pill & Glass Nav)
       ========================================================================= -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="index.html" class="brand-wrapper" aria-label="학급 포털 메인">
        <div class="brand-emblem">2-2</div>
        <div class="brand-title-group">
          <h1 id="portal-title">2학년 2반</h1>
          <span id="class-badge" class="mono-text">2026학년도</span>
        </div>
      </a>

      <nav class="nav-menu" aria-label="주요 이동 메뉴">
        <a href="index.html" class="nav-link">
          <span>홈</span>
        </a>
        <a href="notice.html" class="nav-link active" aria-current="page">
          <span>공지사항</span>
        </a>
        <a href="board.html" class="nav-link">
          <span>자유게시판</span>
        </a>
        <a href="https://forms.google.com" id="suggestion-link" target="_blank" rel="noopener noreferrer"
          class="nav-link">
          <span>건의함 ↗</span>
        </a>
      </nav>

      <div class="nav-actions">
        <div id="today-date-text" class="mono-text">2026.08.31 (월)</div>
        <button id="theme-toggle" class="btn-icon-square" aria-label="테마 변경">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- =========================================================================
       Notice Content
       ========================================================================= -->
  <main class="main-wrapper">
    <div class="container">

      <!-- Status Strip -->
      <section class="status-deck" aria-label="공지사항 현황">
        <div class="status-deck-left">
          <span class="status-deck-title">학급 공지사항</span>
        </div>
        <div class="status-deck-right">
          <span id="next-exam-chip" class="d-day-chip mono-text"></span>
        </div>
      </section>

      <!-- Search & Tab Filter Controls Bar -->
      <section class="controls-bar" aria-label="검색 및 필터">
        <!-- Search Input with Keyboard Shortcut Hint -->
        <div class="search-input-wrapper">
          <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="search" id="notice-search-input" class="search-input" placeholder="제목, 내용, 작성자 검색..."
            autocomplete="off">
          <span class="search-kbd-hint">/</span>
        </div>

        <!-- Filter Tab Buttons -->
        <div id="notice-filter-bar" class="filter-tabs-wrapper" role="tablist">
          <button class="tab-btn active" data-filter="all" role="tab" aria-selected="true">
            <span>전체</span>
            <span id="count-notice-all" class="tab-count mono-text">0</span>
          </button>
          <button class="tab-btn" data-filter="공지" role="tab" aria-selected="false">
            <span>공지</span>
            <span id="count-notice-normal" class="tab-count mono-text">0</span>
          </button>
          <button class="tab-btn" data-filter="알림" role="tab" aria-selected="false">
            <span>알림/필독</span>
            <span id="count-notice-alert" class="tab-count mono-text">0</span>
          </button>
        </div>
      </section>

      <!-- Full Notice Cards List -->
      <section class="workbench-panel" aria-label="공지사항 전체 목록">
        <div id="full-notice-list" class="notice-feed-list">
          <!-- JavaScript dynamically renders notice cards here -->
        </div>
      </section>

    </div>
  </main>

  <!-- =========================================================================
       Common Detail Popup Modal
       ========================================================================= -->
  <div id="detail-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-header-left">
          <span id="modal-badge" class="notice-pill pill-notice">공지</span>
        </div>
        <button id="modal-close-btn" class="modal-close-btn" aria-label="닫기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="modal-content-area">
        <h3 id="modal-title" class="modal-heading">공지사항 상세 제목</h3>
        <div class="modal-meta-row mono-text">
          <span id="modal-author">작성자: 학급알리미</span>
          <span id="modal-date">2026.08.31 (월)</span>
        </div>
        <div id="modal-body">
          상세 본문 내용이 이곳에 표시됩니다.
        </div>
      </div>

      <div class="modal-footer">
        <button id="modal-copy-btn" class="btn-secondary" aria-label="본문 복사">
          <span>📋</span> <span>내용 복사</span>
        </button>
        <button class="btn-primary modal-close-trigger">확인</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Site Footer (Hallmark Ft5 Statement Archetype) -->
  <footer class="site-footer">
    <div class="container footer-content">
      <p class="mono-text">© 2026 2학년 2반 · <a href="admin.html" style="color: var(--color-ink-muted); text-decoration: none;">🔒 관리자</a></p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>

</html>
